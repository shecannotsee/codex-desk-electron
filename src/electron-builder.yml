appId: com.conductor.electron
productName: Conductor
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

directories:
  output: dist
  buildResources: build

files:
  - "app/**/*"
  - "scripts/deb/**/*"
  - "package.json"

extraMetadata:
  main: "app/main/main.js"

asar: true

extraResources:
  - from: ../resource
    to: resource

linux:
  target:
    - target: deb
      arch:
        - x64
  category: Development
  executableName: conductor
  icon: build/icon.png
  desktop:
    Name: Conductor
    Comment: Codex CLI desktop GUI with runtime observability
    StartupWMClass: Conductor
    Terminal: false

deb:
  priority: optional
  maintainer: Conductor Maintainers
  synopsis: Codex CLI desktop GUI
  description: Conductor is an Electron desktop client for Codex CLI with multi-conversation workflow and runtime observability.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libdrm2
    - libgbm1
    - libasound2
    - libsecret-1-0
  afterInstall: scripts/deb/postinst
  afterRemove: scripts/deb/postrm
